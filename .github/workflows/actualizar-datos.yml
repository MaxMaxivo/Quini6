name: Actualizar datos Quini 6

on:
  workflow_dispatch:
  schedule:
    # 09:30 de Argentina (UTC-3), después de los sorteos.
    - cron: '30 12 * * 1,4'

concurrency:
  group: actualizar-datos-quini-6
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Actualizar resultados
        run: python scripts/actualizar_resultados.py

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No hay resultados nuevos para publicar."
          else
            git commit -m "Actualizar data.json"
            git push
          fi
